[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netsage"
version = "0.1.0.dev0"
description = "Provider-agnostic AI Network & Infrastructure Investigator"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "NetSage contributors" }]
dependencies = [
  "asyncssh>=2.21,<3",
  "cryptography>=45,<48",
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "scrapli>=2025.1,<2027",
  "structlog>=25,<26",
  "typer>=0.16,<1",
]

[project.scripts]
netsage = "netsage.cli.main:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pyinstaller>=6.14,<7",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netsage"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["netsage"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["netsage"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--cov=netsage --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
